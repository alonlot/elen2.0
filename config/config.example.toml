# Elen 2.0 configuration: ~/.config/elen/config.toml
# After you change this file: systemctl --user restart elen
#
# Secrets (API keys, passwords) can be written as:
#   "env:VAR"        environment variable (put it in ~/.config/elen/env)
#   "cmd:COMMAND"    output of a command, for example "cmd:secret-tool lookup elen mail"
#   "file:PATH"      content of a file

[user]
name = ""            # how Elen addresses you
language = "en"      # reply language
timezone = ""        # informative only; Elen uses the system time zone

# ---------------------------------------------------------------- models
# Change these here, in the settings window (gear button in the chat), or with
#   elen set brain.model llama3.1:70b
#
# The brain is ANY LLM, called through its API:
#   provider = "openai_compatible"  any server with the OpenAI chat API (default)
#   provider = "ollama"             the same, base_url defaults to http://localhost:11434/v1
#   provider = "anthropic"          Claude API
# To act on the computer, the brain calls Claude Code (`claude -p`) as a TOOL:
# see [plugins.claude_code]
# The brain's hands: it can give a task to `claude -p` (Claude Code), which edits files and
# runs commands. You approve each task first (you can edit the task text).
enabled = true              # turns itself off with a message if `claude` is not installed
binary = "claude"
bypass_permissions = true   # adds --dangerously-skip-permissions: no more questions inside a task
model = ""                  # empty = Claude Code default; or "opus", "sonnet", a full model id
base_url = ""               # optional ANTHROPIC_BASE_URL for Claude Code (gateway / proxy)
api_key = ""                # empty = your `claude` login
workdir = "~"
timeout = 900
extra_args = []

# Your own plugins: [plugins.<name>] with any settings they need.
# [plugins.weather]
# city = "Tel Aviv"
