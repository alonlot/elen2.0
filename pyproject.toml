[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elen"
version = "2.0.0"
description = "Elen 2.0: a Jarvis-like personal assistant for the GNOME desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.60",
    "httpx>=0.27",
    "dbus-next>=0.2.3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
calendar = ["caldav>=1.3", "icalendar>=5.0", "recurring-ical-events>=2.0"]
local-stt = ["faster-whisper>=1.0"]
wake = ["vosk>=0.3.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
all = ["caldav>=1.3", "icalendar>=5.0", "recurring-ical-events>=2.0", "faster-whisper>=1.0", "vosk>=0.3.45"]

[project.scripts]
elen = "elen.__main__:main"

[tool.setuptools.packages.find]
include = ["elen*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
